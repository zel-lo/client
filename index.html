<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F4F7" />
    <meta name="description" content="zello는 회의에서 정한 작업, 담당자, PR과 변경 소식을 연결하는 팀 협업툴입니다." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before the first paint.
      try {
        const theme = JSON.parse(localStorage.getItem('gyeol.theme.v2') || '"light"') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#12151F' : '#F2F4F7';
        document.querySelector('link[rel="icon"]').href = '/brand/zello-logo-' + theme + '.svg';
      } catch { /* Use the default light theme when storage is unavailable. */ }
    </script>
    <title>zello | 팀 협업툴</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
